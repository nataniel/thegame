name: thegame

services:
  php:
    build:
      context: .
      target: development
      args:
        # UID and GID must be set as environment variables on the host machine
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    environment:
      PHP_POST_MAX_SIZE: "500M"
      PHP_UPLOAD_MAX_FILE_SIZE: "500M"
      SSL_MODE: "mixed"
      PHP_DATE_TIMEZONE: "Europe/Warsaw"
    ports:
      - "8082:8080"
    volumes:
      - .:/var/www/html
    networks:
      - local

  mysql:
    image: mysql
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
      MYSQL_DATABASE: thegame
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - local
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-secret}" ]
      retries: 3
      timeout: 5s

networks:
  local:
    driver: bridge

volumes:
  mysql-data:
  php-fpm-socket: